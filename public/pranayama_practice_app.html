
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); }
  #app { padding: 1.5rem 0; max-width: 560px; margin: 0 auto; }
  h2 { font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-text-tertiary); margin-bottom: 0.5rem; }
  .step-tabs { display: flex; gap: 6px; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .step-tab { font-size: 12px; padding: 5px 12px; border-radius: 20px; border: 0.5px solid var(--color-border-secondary); background: transparent; color: var(--color-text-secondary); cursor: pointer; transition: all 0.2s; }
  .step-tab.active { background: #1D9E75; border-color: #1D9E75; color: #fff; font-weight: 500; }
  .step-tab:hover:not(.active) { background: var(--color-background-secondary); }
  .step-info { margin-bottom: 1.5rem; min-height: 48px; }
  .step-title { font-size: 15px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 4px; }
  .step-desc { font-size: 13px; color: var(--color-text-secondary); line-height: 1.5; }
  .circle-wrap { display: flex; flex-direction: column; align-items: center; gap: 1rem; margin: 1.5rem 0; }
  .circle-svg { display: block; }
  .phase-label { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); letter-spacing: 0.06em; text-transform: uppercase; min-height: 20px; text-align: center; }
  .count-display { font-size: 52px; font-weight: 400; color: var(--color-text-primary); line-height: 1; font-family: var(--font-serif); min-height: 60px; text-align: center; }
  .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 1.5rem; }
  .btn-main { padding: 10px 32px; font-size: 14px; font-weight: 500; border-radius: 24px; border: 0.5px solid var(--color-border-secondary); background: transparent; color: var(--color-text-primary); cursor: pointer; transition: all 0.15s; }
  .btn-main:hover { background: var(--color-background-secondary); }
  .btn-main.running { background: #1D9E75; border-color: #1D9E75; color: #fff; }
  .btn-reset { padding: 10px 18px; font-size: 14px; border-radius: 24px; border: 0.5px solid var(--color-border-tertiary); background: transparent; color: var(--color-text-tertiary); cursor: pointer; }
  .btn-reset:hover { background: var(--color-background-secondary); }
  .ratio-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .ratio-label { font-size: 12px; color: var(--color-text-secondary); min-width: 80px; }
  .ratio-val { font-size: 12px; font-weight: 500; color: var(--color-text-primary); min-width: 20px; text-align: right; }
  .session-bar { background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 1rem 1.25rem; display: flex; gap: 24px; margin-top: 1rem; }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat-val { font-size: 20px; font-weight: 500; color: var(--color-text-primary); }
  .stat-label { font-size: 11px; color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.08em; }
  .tip { font-size: 12px; color: var(--color-text-tertiary); line-height: 1.6; border-left: 2px solid #1D9E75; padding-left: 10px; margin-top: 1.25rem; font-style: italic; }
</style>

<div id="app">
  <h2>Pranayama Practice</h2>
  <div class="step-tabs" id="stepTabs"></div>
  <div class="step-info">
    <div class="step-title" id="stepTitle"></div>
    <div class="step-desc" id="stepDesc"></div>
  </div>

  <div class="circle-wrap">
    <svg class="circle-svg" width="200" height="200" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="80" fill="none" stroke="var(--color-border-tertiary)" stroke-width="2"/>
      <circle id="progressRing" cx="100" cy="100" r="80" fill="none" stroke="#1D9E75" stroke-width="3"
        stroke-dasharray="502" stroke-dashoffset="502" stroke-linecap="round"
        transform="rotate(-90 100 100)" style="transition: stroke-dashoffset 0.25s linear, stroke 0.3s;"/>
      <circle cx="100" cy="100" r="60" fill="var(--color-background-secondary)"/>
      <text id="svgCount" x="100" y="108" text-anchor="middle" font-size="36" font-weight="400" fill="var(--color-text-primary)" font-family="Georgia, serif">—</text>
    </svg>
    <div class="phase-label" id="phaseLabel">ready</div>
  </div>

  <div class="controls">
    <button class="btn-main" id="startBtn" onclick="toggleRun()"><i class="ti ti-player-play" aria-hidden="true"></i> begin</button>
    <button class="btn-reset" onclick="resetSession()"><i class="ti ti-refresh" aria-hidden="true"></i> reset</button>
  </div>

  <div id="ratioArea" style="margin-bottom:1rem;"></div>

  <div class="session-bar">
    <div class="stat"><div class="stat-val" id="cycleCount">0</div><div class="stat-label">cycles</div></div>
    <div class="stat"><div class="stat-val" id="elapsedTime">0:00</div><div class="stat-label">elapsed</div></div>
    <div class="stat"><div class="stat-val" id="breathRate">—</div><div class="stat-label">breath / min</div></div>
  </div>

  <div class="tip" id="tipText"></div>
</div>

<script>
const steps = [
  {
    id: 0,
    name: "Ujjayi",
    title: "Step 1 — Ujjayi (ocean breath)",
    desc: "Inhale and exhale through the nose with a soft throat constriction, making a gentle ocean sound. No holds.",
    phases: ["inhale","exhale"],
    counts: [4,4],
    holdTop: 0, holdBot: 0,
    ratioSliders: false,
    tip: "The slight throat resistance slows the breath naturally and draws attention inward. Let your eyes soften.",
    phaseColors: { inhale:"#1D9E75", exhale:"#0F6E56", holdTop:"#5DCAA5", holdBot:"#085041" }
  },
  {
    id: 1,
    name: "Sama Vritti",
    title: "Step 2 — Equal breathing (Sama Vritti)",
    desc: "Breathe in for 4 counts, breathe out for 4 counts. Let the mind ride the wave. Practice for 5 minutes.",
    phases: ["inhale","exhale"],
    counts: [4,4],
    holdTop: 0, holdBot: 0,
    ratioSliders: true,
    tip: "Equal ratio brings mental balance. If thoughts arise, simply return to counting.",
    phaseColors: { inhale:"#1D9E75", exhale:"#0F6E56" }
  },
  {
    id: 2,
    name: "Kumbhaka",
    title: "Step 3 — Introducing the gap (Kumbhaka)",
    desc: "Inhale → hold at top → exhale → hold at bottom. Relax into each pause — do not clench. Slowly increase hold counts over weeks.",
    phases: ["inhale","hold","exhale","hold"],
    counts: [4,2,4,2],
    holdTop: 2, holdBot: 2,
    ratioSliders: true,
    tip: "When holding, do not squeeze the throat or jaw. Hold by not breathing, not by gripping.",
    phaseColors: { inhale:"#1D9E75", exhale:"#0F6E56", holdTop:"#5DCAA5", holdBot:"#085041" }
  },
  {
    id: 3,
    name: "The Gap",
    title: "Step 4 — The micro-gap (advanced)",
    desc: "Stop counting. Let the breath slow to its own rhythm. Rest awareness entirely in the pause. Ask: who is aware of this stillness?",
    phases: ["inhale","hold","exhale","hold"],
    counts: [5,4,5,4],
    holdTop: 4, holdBot: 4,
    ratioSliders: false,
    tip: "Treat the inhale and exhale as doors that open and close to reveal the room of consciousness. You are what remains in the pause.",
    phaseColors: { inhale:"#1D9E75", exhale:"#0F6E56", holdTop:"#5DCAA5", holdBot:"#085041" }
  }
];

let currentStep = 0;
let running = false;
let phaseIdx = 0;
let phaseTimer = null;
let elapsedTimer = null;
let countVal = 0;
let cycles = 0;
let startTime = null;
let tickInterval = null;
let customCounts = [[4,4],[4,4],[4,2,4,2],[5,4,5,4]];

const phaseNames = { inhale:"inhale", holdTop:"hold — full", exhale:"exhale", holdBot:"hold — empty" };
const phaseKeys = [["inhale","exhale"],["inhale","exhale"],["inhale","holdTop","exhale","holdBot"],["inhale","holdTop","exhale","holdBot"]];

function getPhaseKey(step, idx) { return phaseKeys[step][idx]; }
function getCounts(step) { return customCounts[step]; }

function renderTabs() {
  const el = document.getElementById('stepTabs');
  el.innerHTML = steps.map((s,i) => `<button class="step-tab${i===currentStep?' active':''}" onclick="selectStep(${i})">${s.name}</button>`).join('');
}
function renderInfo() {
  const s = steps[currentStep];
  document.getElementById('stepTitle').textContent = s.title;
  document.getElementById('stepDesc').textContent = s.desc;
  document.getElementById('tipText').textContent = s.tip;
  renderRatios();
}
function renderRatios() {
  const s = steps[currentStep];
  const area = document.getElementById('ratioArea');
  if(!s.ratioSliders) { area.innerHTML=''; return; }
  const counts = getCounts(currentStep);
  const phKeys = phaseKeys[currentStep];
  area.innerHTML = `<h2 style="margin-bottom:0.75rem;">adjust counts</h2>` +
    phKeys.map((pk,i) => `
      <div class="ratio-row">
        <span class="ratio-label">${phaseNames[pk]||pk}</span>
        <input type="range" min="1" max="16" step="1" value="${counts[i]}" style="flex:1;"
          oninput="updateCount(${i},+this.value,this)" />
        <span class="ratio-val" id="cv${i}">${counts[i]}</span>
      </div>`
    ).join('');
}
function updateCount(i, val, el) {
  customCounts[currentStep][i] = val;
  document.getElementById('cv'+i).textContent = val;
}
function selectStep(i) {
  if(running) stopSession();
  currentStep = i;
  phaseIdx = 0; countVal = 0; cycles = 0;
  updateDisplay();
  renderTabs();
  renderInfo();
  resetSession();
}

function updateDisplay() {
  document.getElementById('svgCount').textContent = '—';
  document.getElementById('phaseLabel').textContent = 'ready';
  setRing(0, '#1D9E75');
}

function toggleRun() {
  if(running) stopSession(); else startSession();
}
function startSession() {
  running = true;
  if(!startTime) startTime = Date.now();
  document.getElementById('startBtn').innerHTML = '<i class="ti ti-player-pause" aria-hidden="true"></i> pause';
  document.getElementById('startBtn').classList.add('running');
  startElapsedTimer();
  runPhase();
}
function stopSession() {
  running = false;
  clearTimeout(phaseTimer);
  clearInterval(elapsedTimer);
  clearInterval(tickInterval);
  document.getElementById('startBtn').innerHTML = '<i class="ti ti-player-play" aria-hidden="true"></i> resume';
  document.getElementById('startBtn').classList.remove('running');
}
function resetSession() {
  stopSession();
  running = false; phaseIdx = 0; countVal = 0; cycles = 0; startTime = null;
  document.getElementById('startBtn').innerHTML = '<i class="ti ti-player-play" aria-hidden="true"></i> begin';
  document.getElementById('startBtn').classList.remove('running');
  document.getElementById('svgCount').textContent = '—';
  document.getElementById('phaseLabel').textContent = 'ready';
  document.getElementById('cycleCount').textContent = '0';
  document.getElementById('elapsedTime').textContent = '0:00';
  document.getElementById('breathRate').textContent = '—';
  setRing(0, '#1D9E75');
}

function runPhase() {
  if(!running) return;
  const counts = getCounts(currentStep);
  const phaseName = getPhaseKey(currentStep, phaseIdx);
  const total = counts[phaseIdx];
  const s = steps[currentStep];
  const color = s.phaseColors[phaseName] || '#1D9E75';
  let c = 0;

  document.getElementById('phaseLabel').textContent = phaseNames[phaseName] || phaseName;
  setRing(0, color);
  clearInterval(tickInterval);

  tickInterval = setInterval(() => {
    if(!running) { clearInterval(tickInterval); return; }
    c++;
    document.getElementById('svgCount').textContent = c;
    setRing(c/total, color);
    if(c >= total) {
      clearInterval(tickInterval);
      phaseIdx = (phaseIdx+1) % phaseKeys[currentStep].length;
      if(phaseIdx === 0) {
        cycles++;
        document.getElementById('cycleCount').textContent = cycles;
        updateBreathRate();
      }
      phaseTimer = setTimeout(runPhase, 200);
    }
  }, 1000);
}

function setRing(frac, color) {
  const circ = 2*Math.PI*80;
  const offset = circ*(1-frac);
  const ring = document.getElementById('progressRing');
  ring.style.strokeDashoffset = offset;
  ring.style.stroke = color;
}

function startElapsedTimer() {
  clearInterval(elapsedTimer);
  elapsedTimer = setInterval(() => {
    if(!startTime) return;
    const s = Math.floor((Date.now()-startTime)/1000);
    const m = Math.floor(s/60), sec = s%60;
    document.getElementById('elapsedTime').textContent = m+':'+(sec<10?'0':'')+sec;
  }, 1000);
}

function updateBreathRate() {
  if(!startTime || cycles<1) return;
  const elapsed = (Date.now()-startTime)/60000;
  const rate = Math.round(cycles/elapsed);
  document.getElementById('breathRate').textContent = rate;
}

renderTabs();
renderInfo();
updateDisplay();
</script>
