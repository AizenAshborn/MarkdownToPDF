<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Century Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;width:100%;background:#080c0c}
  .root{
    width:100vw;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:#080c0c;
    position:relative;
    overflow:hidden;
    font-family:'Share Tech Mono',monospace;
    padding:2rem;
  }
  .grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.025) 1px,transparent 1px);background-size:44px 44px;pointer-events:none}
  .scan{position:absolute;top:-2px;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.5) 50%,transparent);animation:scan 5s linear infinite;pointer-events:none}
  @keyframes scan{0%{top:-2px}100%{top:102%}}
  .input-screen{z-index:1;display:flex;flex-direction:column;align-items:center;gap:1.6rem;width:100%}
  .cyber-title{font-size:11px;letter-spacing:8px;color:#fff;opacity:0.35;text-transform:uppercase}
  .sub{font-size:9px;letter-spacing:4px;color:#fff;opacity:0.2;text-transform:uppercase;margin-top:-10px}
  .field{display:flex;flex-direction:column;align-items:center;gap:8px}
  .field-lbl{font-size:9px;letter-spacing:4px;color:#fff;opacity:0.35;text-transform:uppercase}
  .dob-input{background:#0d1117;border:1px solid rgba(255,255,255,0.15);color:#fff;font-family:'Share Tech Mono',monospace;font-size:1rem;padding:12px 24px;border-radius:6px;outline:none;letter-spacing:2px;text-align:center;width:240px;}
  .dob-input:focus{border-color:rgba(255,255,255,0.45);box-shadow:0 0 16px rgba(255,255,255,0.06)}
  .dob-input::-webkit-calendar-picker-indicator{filter:invert(1);opacity:0.35;cursor:pointer}
  .go-btn{background:#0d1117;border:1px solid rgba(255,255,255,0.2);color:#fff;font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:5px;text-transform:uppercase;padding:12px 40px;border-radius:6px;cursor:pointer;opacity:0.85;transition:all 0.2s;}
  .go-btn:hover{border-color:rgba(255,255,255,0.6);opacity:1;box-shadow:0 0 20px rgba(255,255,255,0.07)}
  .go-btn:active{transform:scale(0.97)}
  .err{font-size:9px;letter-spacing:2px;color:#ff7070;text-align:center;max-width:300px}
  .countdown-screen{z-index:1;display:none;flex-direction:column;align-items:center;width:100%;gap:0}
  .hdr{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:2.5rem}
  .dob-line{font-size:9px;letter-spacing:5px;color:#fff;opacity:0.25;text-transform:uppercase}
  .cen-line{font-size:11px;letter-spacing:4px;color:#fff;opacity:0.45;text-transform:uppercase}
  .timer-row{display:flex;gap:14px;align-items:center;justify-content:center}
  .block{display:flex;flex-direction:column;align-items:center}
  .block-inner{position:relative;width:140px;height:110px;display:flex;align-items:center;justify-content:center;background:#0d1117;border:1px solid rgba(255,255,255,0.1);border-radius:8px;overflow:hidden;}
  .block-inner::after{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,0.05)}
  .corner{position:absolute;width:10px;height:10px;border-color:rgba(255,255,255,0.3);border-style:solid}
  .corner.tl{top:5px;left:5px;border-width:1px 0 0 1px}
  .corner.tr{top:5px;right:5px;border-width:1px 1px 0 0}
  .corner.bl{bottom:5px;left:5px;border-width:0 0 1px 1px}
  .corner.br{bottom:5px;right:5px;border-width:0 1px 1px 0}
  .digit{font-size:2.8rem;color:#fff;text-shadow:0 0 18px rgba(255,255,255,0.95),0 0 45px rgba(255,255,255,0.3);line-height:1;white-space:nowrap;}
  .lbl{font-size:9px;letter-spacing:4px;color:#fff;opacity:0.25;margin-top:9px;text-transform:uppercase}
  .sep{font-size:2rem;color:#fff;opacity:0.2;margin-bottom:20px;animation:blink 1s step-start infinite;flex-shrink:0}
  @keyframes blink{0%,100%{opacity:0.22}50%{opacity:0.05}}
  .prog-wrap{width:80%;max-width:620px;margin-top:2.4rem}
  .prog-labels{display:flex;justify-content:space-between;font-size:8px;letter-spacing:2px;color:rgba(255,255,255,0.2);margin-bottom:7px;text-transform:uppercase}
  .prog-bar{height:1px;background:rgba(255,255,255,0.08);border-radius:1px}
  .prog-fill{height:100%;background:#fff;border-radius:1px;box-shadow:0 0 8px rgba(255,255,255,0.9),0 0 20px rgba(255,255,255,0.4)}
  .age-line{font-size:8px;letter-spacing:3px;color:rgba(255,255,255,0.18);margin-top:11px;text-align:center;text-transform:uppercase}
  .reset-btn{margin-top:2rem;background:transparent;border:none;color:rgba(255,255,255,0.18);font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:4px;cursor:pointer;text-transform:uppercase;padding:4px 10px}
  .reset-btn:hover{color:rgba(255,255,255,0.5)}
  .flip-in{animation:flipIn 0.16s ease-out}
  @keyframes flipIn{from{transform:translateY(-8px);opacity:0.1}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div class="root">
  <div class="grid-bg"></div>
  <div class="scan"></div>

  <div class="input-screen" id="inputScreen">
    <div class="cyber-title">⬡ century countdown ⬡</div>
    <div class="sub">how long until you turn 100</div>
    <div class="field">
      <div class="field-lbl">date of birth</div>
      <input type="date" class="dob-input" id="dobInput" />
    </div>
    <button class="go-btn" id="goBtn">⬡ initiate ⬡</button>
    <div class="err" id="errMsg" style="display:none"></div>
  </div>

  <div class="countdown-screen" id="countdownScreen">
    <div class="hdr">
      <div class="dob-line" id="dobDisplay">born ——</div>
      <div class="cen-line">time to your 100th birthday</div>
    </div>
    <div class="timer-row">
      <div class="block">
        <div class="block-inner">
          <div class="corner tl"></div><div class="corner tr"></div>
          <div class="corner bl"></div><div class="corner br"></div>
          <span class="digit" id="d-days">00000</span>
        </div>
        <span class="lbl">days</span>
      </div>
      <div class="sep">:</div>
      <div class="block">
        <div class="block-inner">
          <div class="corner tl"></div><div class="corner tr"></div>
          <div class="corner bl"></div><div class="corner br"></div>
          <span class="digit" id="d-hrs">00</span>
        </div>
        <span class="lbl">hrs</span>
      </div>
      <div class="sep">:</div>
      <div class="block">
        <div class="block-inner">
          <div class="corner tl"></div><div class="corner tr"></div>
          <div class="corner bl"></div><div class="corner br"></div>
          <span class="digit" id="d-mins">00</span>
        </div>
        <span class="lbl">min</span>
      </div>
      <div class="sep">:</div>
      <div class="block">
        <div class="block-inner">
          <div class="corner tl"></div><div class="corner tr"></div>
          <div class="corner bl"></div><div class="corner br"></div>
          <span class="digit" id="d-secs">00</span>
        </div>
        <span class="lbl">sec</span>
      </div>
    </div>
    <div class="prog-wrap">
      <div class="prog-labels">
        <span id="ageLeft">age 0</span>
        <span>100 years</span>
      </div>
      <div class="prog-bar">
        <div class="prog-fill" id="prog" style="width:0%"></div>
      </div>
    </div>
    <div class="age-line" id="ageLine">current age ——</div>
    <button class="reset-btn" id="resetBtn">[ reset ]</button>
  </div>
</div>

<script>
  const pad2 = n => n < 10 ? '0' + n : '' + n;
  const prev = {};
  let rafId = null;
  let running = false;

  function animate(el) {
    el.classList.remove('flip-in');
    void el.offsetWidth;
    el.classList.add('flip-in');
  }

  function startCountdown(dob) {
    running = true;
    const century = new Date(dob);
    century.setFullYear(century.getFullYear() + 100);
    const totalMs = century.getTime() - dob.getTime();
    document.getElementById('dobDisplay').textContent =
      'born — ' + dob.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });

    function tick() {
      if (!running) return;
      const now = Date.now();
      const diff = century.getTime() - now;
      if (diff <= 0) {
        document.getElementById('d-days').textContent = '0';
        document.getElementById('d-hrs').textContent = '00';
        document.getElementById('d-mins').textContent = '00';
        document.getElementById('d-secs').textContent = '00';
        document.getElementById('ageLine').textContent = '🎉 you have reached 100 years!';
        document.getElementById('prog').style.width = '100%';
        return;
      }
      const days = Math.floor(diff / 86400000);
      const hrs  = Math.floor((diff % 86400000) / 3600000);
      const mins = Math.floor((diff % 3600000) / 60000);
      const secs = Math.floor((diff % 60000) / 1000);
      const dStr = '' + days, hStr = pad2(hrs), mStr = pad2(mins), sStr = pad2(secs);
      const dEl = document.getElementById('d-days');
      const hEl = document.getElementById('d-hrs');
      const mEl = document.getElementById('d-mins');
      const sEl = document.getElementById('d-secs');
      if (dStr !== prev.d) { dEl.textContent = dStr; animate(dEl); prev.d = dStr; }
      if (hStr !== prev.h) { hEl.textContent = hStr; animate(hEl); prev.h = hStr; }
      if (mStr !== prev.m) { mEl.textContent = mStr; animate(mEl); prev.m = mStr; }
      if (sStr !== prev.s) { sEl.textContent = sStr; animate(sEl); prev.s = sStr; }
      const elapsed = now - dob.getTime();
      const pct = Math.min(100, (elapsed / totalMs) * 100);
      document.getElementById('prog').style.width = pct.toFixed(4) + '%';
      const ageYears  = Math.floor(elapsed / (365.25 * 86400000));
      const ageMonths = Math.floor((elapsed % (365.25 * 86400000)) / (30.44 * 86400000));
      document.getElementById('ageLeft').textContent = 'age ' + ageYears;
      document.getElementById('ageLine').textContent = 'current age — ' + ageYears + ' yrs ' + ageMonths + ' mo';
      rafId = requestAnimationFrame(tick);
    }
    rafId = requestAnimationFrame(tick);
  }

  document.getElementById('goBtn').addEventListener('click', function() {
    const val = document.getElementById('dobInput').value;
    const err = document.getElementById('errMsg');
    err.style.display = 'none';
    if (!val) { err.textContent = '⬡ please enter your date of birth'; err.style.display = 'block'; return; }
    const parts = val.split('-');
    const dob = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
    const now = new Date();
    if (dob >= now) { err.textContent = '⬡ date must be in the past'; err.style.display = 'block'; return; }
    const century = new Date(dob);
    century.setFullYear(dob.getFullYear() + 100);
    if (century <= now) { err.textContent = '⬡ you already hit 100 — absolute legend.'; err.style.display = 'block'; return; }
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    Object.keys(prev).forEach(k => delete prev[k]);
    document.getElementById('inputScreen').style.display = 'none';
    const cs = document.getElementById('countdownScreen');
    cs.style.display = 'flex';
    startCountdown(dob);
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    document.getElementById('countdownScreen').style.display = 'none';
    document.getElementById('inputScreen').style.display = 'flex';
    document.getElementById('dobInput').value = '';
    document.getElementById('errMsg').style.display = 'none';
  });
</script>
</body>
</html>
